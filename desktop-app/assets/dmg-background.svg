<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="60%"  stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow1)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80"  x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Title -->
  <text x="300" y="52" text-anchor="middle"
        font-family="-apple-system, 'Inter', sans-serif"
        font-size="26" font-weight="800" fill="white" opacity="0.95"
        letter-spacing="-0.5">SDLC Pipeline</text>
  <text x="300" y="74" text-anchor="middle"
        font-family="-apple-system, 'Inter', sans-serif"
        font-size="12" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">
    Multi-Agent · Claude AI
  </text>

  <!-- Arrow instruction -->
  <text x="300" y="360" text-anchor="middle"
        font-family="-apple-system, 'Inter', sans-serif"
        font-size="12" fill="rgba(255,255,255,0.35)">
    Drag SDLC Pipeline to Applications to install
  </text>

  <!-- Decorative dots -->
  <circle cx="60"  cy="200" r="3" fill="rgba(99,102,241,0.5)"/>
  <circle cx="100" cy="160" r="2" fill="rgba(99,102,241,0.4)"/>
  <circle cx="540" cy="200" r="3" fill="rgba(6,182,212,0.5)"/>
  <circle cx="500" cy="160" r="2" fill="rgba(6,182,212,0.4)"/>
</svg>

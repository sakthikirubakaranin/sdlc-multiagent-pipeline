version: "3.9"

services:
  # ─── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdlc_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    depends_on:
      - db
    networks:
      - sdlc_net

  # ─── Streamlit UI ───────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdlc_ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    depends_on:
      - api
    networks:
      - sdlc_net

  # ─── PostgreSQL (production database) ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sdlc_db
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc_password
      POSTGRES_DB: sdlc_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sdlc_net

  # ─── Prometheus monitoring ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sdlc_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sdlc_net

  # ─── Grafana dashboards ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sdlc_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sdlc_net

volumes:
  postgres_data:
  grafana_data:

networks:
  sdlc_net:
    driver: bridge
